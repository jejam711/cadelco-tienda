    #sc .hero{height:200px;animation:up .5s both}

    #sv{transition:background .8s}
    #sv::before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at 30% 20%,#ff6b5e44,#0000 45%),radial-gradient(circle at 80% 80%,#4aa3ff40,#0000 50%);animation:dr 14s ease-in-out infinite alternate;pointer-events:none}

    .cores{display:flex;gap:10px}.cores i{width:48px;height:48px;border-radius:10px;background:#ff6b5e;animation:co 1.1s ease-in-out infinite alternate}

    .eq{display:flex;gap:6px;align-items:flex-end;height:110px}.eq i{flex:1;height:60%;background:#ff6b5e;border-radius:4px 4px 0 0;animation:eq .9s ease-in-out infinite alternate}

    .ap{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.ap i{aspect-ratio:1;border-radius:14px;animation:pop .5s both}

let D = [];
async function cargarCatalogoProtegido() {
try {
const respuesta = await fetch('/api/catalogo');
const datos = await respuesta.json();
if (datos.success && datos.articulos && datos.articulos.length > 0) {
D = datos.articulos.map(art => {
const tech = art.caracteristicas_tecnicas || {};
return [
art.marca || "", art.modelo || "", parseFloat(tech.pulgadas) || 0,
tech.tipo_pantalla || "", ${tech.resolucion_etiqueta || ''}|${tech.resolucion_detalle || ''},
parseInt(tech.refresco) || 60, tech.contraste || "",
${tech.procesador_etiqueta || ''}|${tech.procesador_detalle || ''},
${tech.sonido_etiqueta || ''}|${tech.sonido_detalle || ''},
${tech.sistema_etiqueta || ''}|${tech.sistema_detalle || ''},
${tech.ram || ''}|${tech.rom || ''}, tech.conexiones || "",
art.argumento_venta_pitch || ""
];
});
arrancarInterfazProtegida();
} else { throw new Error("Datos vacíos"); }
} catch (error) {
D = D_LOCAL;
arrancarInterfazProtegida();
}
}
function arrancarInterfazProtegida() {
chips();
grid();
const viejoHeader = document.getElementById("hd");
const herramientasBusqueda = document.getElementById("tools");
const rejillaProductos = document.getElementById("grid");
if(viejoHeader) viejoHeader.style.setProperty("display", "none", "important");
if(herramientasBusqueda) herramientasBusqueda.style.setProperty("display", "none", "important");
if(rejillaProductos) {
rejillaProductos.style.setProperty("display", "none", "important");
}
}
function chips() {
const c = document.getElementById("chips");
if(!c) return;
const marcas = ["Todos", ...new Set(D.map(x => x[0]))];
c.innerHTML = marcas.map((m, i) => <button class="ch ${i===0?'on':''}" onclick="filtrarMarca('${m}', this)">${m}</button>).join("");
}
function grid() {
const g = document.getElementById("grid");
if(!g) return;
const q = document.getElementById("q") ? document.getElementById("q").value.toLowerCase() : "";
const activos = D.filter(x => x[0].toLowerCase().includes(q) || x[1].toLowerCase().includes(q));
if(activos.length === 0) { g.innerHTML = 'No se encontraron modelos'; return; }
g.innerHTML = activos.map((x, i) => <div class="cd" onclick="verDetalle('${x[1]}')"> <div class="im"><img src="${IM[i % IM.length]}" alt="${x[0]} ${x[1]}"></div> <b>${x[1]}</b> <small>${x[0]} · ${x[2]}"</small> <em>${x[4].split("|")[0]} - ${x[9].split("|")[0]}</em> </div>).join("");
}
function filtrarMarca(m, btn) {
document.querySelectorAll(".ch").forEach(x => x.classList.remove("on"));
btn.classList.add("on");
const bus = document.getElementById("q");
if(bus) { bus.value = m === "Todos" ? "" : m; grid(); }
}

activarVistaCatalogo("Herramientas y Construcción", "Pineco");
});
if(btnCategorias && megaMenu) {
btnCategorias.addEventListener("click", (e) => {
e.stopPropagation();
const estaOculto = megaMenu.style.display === "none";
megaMenu.style.display = estaOculto ? "flex" : "none";
if (estaOculto && menuFlex && menuFlex.children.length === 0) {
fetch("/api/categorias")
.then(res => res.json())
.then(data => {
if (data.success && data.menu && loadingMenu) {
loadingMenu.style.display = "none";
data.menu.forEach(padre => {
let columna = document.createElement("div");
columna.style.cssText = "flex: 1; min-width: 200px; font-family: sans-serif;";
let tituloPadre = '' + padre.nombre_visible + '';
let listaHijas = '';
padre.subcategorias.forEach(hija => {
listaHijas += '' + hija.nombre_visible + '';
});
listaHijas += '';
columna.innerHTML = tituloPadre + listaHijas;
menuFlex.appendChild(columna);
});
document.querySelectorAll(".enlace-subcategoria-menu").forEach(enlace => {
enlace.addEventListener("click", (evento) => {
evento.preventDefault();
megaMenu.style.display = "none";
const subcatSlug = evento.target.getAttribute("data-slug");
const subcatNombre = evento.target.getAttribute("data-nombre");
if(subcatSlug.includes("pinturas")) {
activarVistaCatalogo(subcatNombre, "Pineco");
} else {
activarVistaCatalogo(subcatNombre, "");
}
});
});
}
})
.catch(err => {
if(loadingMenu) loadingMenu.innerText = "Error al conectar con el servidor de categorías.";
console.error(err);
});
}
});
document.addEventListener("click", () => megaMenu.style.display = "none");
megaMenu.addEventListener("click", (e) => e.stopPropagation());
}
});

</script>

</body>
</html>
